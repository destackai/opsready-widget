<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpsReady WorkCenter — Featured Courses</title>

<!--
  ==========================================================================
  OpsReady WorkCenter — Featured Courses widget
  Alliance for Chemical Distribution · ACD U (acdlearning.docebosaas.com)

  This file is hosted on GitHub Pages at:
    https://destackai.github.io/opsready-widget/

  To show it on a Docebo page (or any site), paste this into a Custom
  Content (HTML) block using the code / <> view:

    <iframe id="opsready-featured"
        src="https://destackai.github.io/opsready-widget/"
        title="Featured Courses" loading="lazy" scrolling="no"
        style="width:100%;border:0;display:block;height:560px"></iframe>
    <script>
      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'opsready:height' && e.data.height) {
          document.getElementById('opsready-featured').style.height = e.data.height + 'px';
        }
      });
    <\/script>

  Editable content lives in the CONFIG block below.
  Artwork key `art:` = regclear | rd | hazmat | safety | regulatory
  ==========================================================================
-->

<style>
  :root {
    --navy:        #122456;
    --navy-700:    #1d2f6b;
    --yellow:      #f5d414;
    --yellow-dark: #d9bb00;
    --surface:     #dde3f5;
    --card:        #ffffff;
    --ink:         #122456;
    --ink-muted:   #5a6785;
    --hairline:    rgba(18,36,86,.10);
    --chip-bg:     #eef1fa;
    --gap:         20px;
    --pad:         30px;
  }

  * { box-sizing: border-box; }
  html { margin: 0; padding: 0; }

  /* Full-bleed surface: the background colour now fills the whole
     viewport, and the shell sits on top of it as a centred container. */
  body {
    margin: 0;
    padding: 0;
    background: var(--surface);
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Shell ---------- */
  .shell {
    max-width: 1340px;
    margin: 0 auto;
    padding: var(--pad);
    background: transparent;
  }
  .shell__head {
    display: flex; flex-wrap: wrap; align-items: center;
    justify-content: space-between; gap: 16px;
  }
  .title {
    display: flex; align-items: center; gap: 12px;
    margin: 0; font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em;
  }
  .title::before {
    content: ""; width: 4px; height: 22px; border-radius: 2px;
    background: var(--yellow); flex: 0 0 auto;
  }
  .subtitle { margin: 8px 0 24px 16px; font-size: .82rem; color: var(--ink-muted); }

  .btn-all {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 18px; border-radius: 10px;
    background: var(--navy); color: #fff;
    font-size: .8rem; font-weight: 700; text-decoration: none;
    transition: background .15s ease;
  }
  .btn-all:hover { background: var(--navy-700); }
  .btn-all svg   { width: 12px; height: 12px; }

  /* ---------- Grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
    gap: var(--gap);
  }
  @media (min-width: 1180px) { .grid { grid-template-columns: repeat(5, 1fr); } }

  /* ---------- Card ---------- */
  /* Whole tile is the link (standard course-tile behaviour) */
  .card {
    position: relative; display: flex; flex-direction: column;
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(18,36,86,.05);
    text-decoration: none; color: inherit;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(18,36,86,.12); }
  .card:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }

  /* Artwork fills the whole media area, edge to edge */
  .card__media {
    position: relative;
    display: block;
    aspect-ratio: 16 / 9;
    min-height: 140px;
    overflow: hidden;
  }
  .card__media svg,
  .card__media img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block; object-fit: cover;
  }
  /* Gentle 5% zoom on hover, for photo thumbnails */
  .card__media img {
    transform-origin: center;
    transition: transform .5s ease;
  }
  .card:hover .card__media img { transform: scale(1.05); }
  .art__ring { transform-origin: 160px 88px; transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
  .art__logo { transform-origin: 160px 90px; transition: transform .5s ease; }
  .card:hover .art__logo { transform: scale(1.05); }
  .card:hover .art__ring { transform: scale(1.05); }

  .card__body { display: flex; flex-direction: column; flex: 1; padding: 16px 16px 4px; }

  .card__title {
    flex: 1; margin: 0 0 16px;
    font-size: .95rem; font-weight: 700; line-height: 1.35; color: var(--ink);
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
    overflow: hidden;
  }

  /* EN | duration ............ ★ rating */
  .card__meta {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 12px; font-size: .8rem; color: var(--ink-muted);
  }
  .card__meta .lang { color: var(--ink-muted); }
  .card__meta .sep  { color: var(--hairline); }
  .card__meta .rating {
    margin-left: auto; display: flex; align-items: center; gap: 4px;
    font-weight: 700; color: var(--ink);
  }
  .card__meta .rating svg { width: 14px; height: 14px; fill: #2b6cb0; }

  .card__rule { height: 1px; margin: 0 -16px; background: var(--hairline); border: 0; }

  .card__type {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 0; font-size: .8rem; color: var(--ink-muted);
  }
  .card__type svg { width: 16px; height: 16px; flex: 0 0 auto; }


  .msg {
    grid-column: 1 / -1; padding: 28px;
    border: 1px dashed var(--hairline); border-radius: 14px;
    background: rgba(255,255,255,.55);
    font-size: .85rem; color: var(--ink-muted); text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .card:hover { transform: none; }
    .card:hover .art__ring { transform: none; }
    .card:hover .art__logo { transform: none; }
    .card:hover .card__media img { transform: none; }
  }
  @media (max-width: 560px) {
    :root { --pad: 20px; --gap: 14px; }
  }
</style>
</head>

<section class="shell" aria-labelledby="fc-title">

function artwork(kind, i) {
  const a = ART[kind] || ART.regulatory;

  // Cards that carry a real logo image (e.g. Responsible Distribution)
  // show it centered on the field, without the drawn seal ring or mark.
  if (a.image) {
    return `
  <svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"
       xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
       role="img" aria-hidden="true" focusable="false">
    ${a.field}
    <g class="art__logo">
      <image x="82" y="11" width="156" height="156"
             href="${a.image}" xlink:href="${a.image}"
             preserveAspectRatio="xMidYMid meet"/>
    </g>
  </svg>`;
  }

  /* Two arcs, both reading left-to-right and upright:
       top    — r62, drawn clockwise over the top of the roundel
       bottom — r62, drawn counter-clockwise round the bottom, so the
                glyphs stay the right way up instead of inverting
     Each label is fitted to its own arc with textLength, so a long
     category name can never overrun the path and get clipped. */
  const TOP    = "M99 77.2 A62 62 0 0 1 221 77.2";
  const BOTTOM = "M106.3 119 A62 62 0 0 0 213.7 119";
  const topLen = 173, botLen = 130;   // arc lengths in viewBox units

  const label = (txt, id, len) => {
    if (!txt) return "";
    const t = String(txt).toUpperCase();
    const natural = t.length * 6.6;    // ~8px Helvetica bold + 1.8 tracking
    const fit = natural > len
      ? ` textLength="${len - 6}" lengthAdjust="spacingAndGlyphs"` : "";
    return `<text font-family="Helvetica,Arial,sans-serif" font-size="8" font-weight="700"
                  letter-spacing="1.8" fill="${a.ringInk}" fill-opacity=".85">
              <textPath href="#${id}" startOffset="50%" text-anchor="middle"${fit}>${t}</textPath>
            </text>`;
  };

  return `
  <svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"
       xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="glow-${i}">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <path id="top-${i}" fill="none" d="${TOP}"/>
      <path id="bot-${i}" fill="none" d="${BOTTOM}"/>
    </defs>
    ${a.field.replace("url(#glow)", `url(#glow-${i})`)}
    <g class="art__ring">
      <circle cx="160" cy="88" r="70" fill="none" stroke="${a.ringInk}" stroke-opacity=".28"/>
      <circle cx="160" cy="88" r="53" fill="none" stroke="${a.ringInk}" stroke-opacity=".14"/>
      <circle cx="90"  cy="88" r="2" fill="${a.ringInk}" fill-opacity=".55"/>
      <circle cx="230" cy="88" r="2" fill="${a.ringInk}" fill-opacity=".55"/>
      ${label(a.ringTop, `top-${i}`, topLen)}
      ${label(a.ringBottom, `bot-${i}`, botLen)}
    </g>
    ${a.mark}
  </svg>`;
}

/* ============================================================
   Rendering
   ============================================================ */

const ICONS = {
  clock:  '<circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.4V8l2.4 1.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
  screen: '<rect x="1.8" y="2.6" width="12.4" height="8.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.4 13.6h5.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
  play:   '<rect x="1.6" y="2.4" width="12.8" height="9" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6.4 5.3v3.8L9.7 7.2z" fill="currentColor"/><path d="M5.4 13.6h5.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>',
  star:   '<path d="M8 1.8 9.9 5.7l4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6L8 1.8Z"/>'
};
const svg = n => `<svg viewBox="0 0 16 16" aria-hidden="true">${ICONS[n]}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const courseUrl = c => c.link || c.buyUrl || `${CONFIG.base}/learn/course/${c.id}/${c.slug}`;

function card(c, i) {
  const url    = courseUrl(c);
  const media  = c.thumb
    ? `<img src="${esc(c.thumb)}" alt="" loading="lazy" decoding="async">`
    : artwork(c.art, i);
  const rating = c.rating
    ? `<span class="rating">${svg('star')}${esc(c.rating)}</span>` : '';
  const dur    = c.duration
    ? `<span class="sep">|</span><span class="dur">${esc(c.duration)}</span>` : '';

  return `<a class="card" role="listitem" href="${esc(url)}" target="_top" rel="noopener"
             aria-label="${esc(c.title)}">
      <div class="card__media">${media}</div>
      <div class="card__body">
        <h3 class="card__title">${esc(c.title)}</h3>
        <div class="card__meta">
          <span class="lang">${esc(c.lang)}</span>${dur}${rating}
        </div>
        <hr class="card__rule">
        <div class="card__type">${svg('play')}<span>${esc(c.type)}</span></div>
      </div>
    </a>`;
}

function render() {
  const grid = document.getElementById('fc-grid');
  const list = CONFIG.courses || [];
  document.getElementById('fc-all').href = CONFIG.base + CONFIG.catalog;
  document.getElementById('fc-sub').textContent = CONFIG.subtitle || '';
  grid.innerHTML = list.length
    ? list.map(card).join('')
    : `<div class="msg">No featured courses right now. Browse the full catalog to find your next requirement.</div>`;
  postHeight();
}

function postHeight() {
  parent.postMessage({ type: 'opsready:height', height: document.documentElement.scrollHeight }, '*');
}

render();
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
</script>
